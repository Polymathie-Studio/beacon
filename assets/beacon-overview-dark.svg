<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, sans-serif">
<rect width="1200" height="640" fill="#14161A"/>
<text x="60" y="78" font-size="44" font-weight="700" fill="#EFF1F4">BEACON</text>
<text x="248" y="78" font-size="20" fill="#B8BABD">Broadcasts Every Author Claim Openly to Networks</text>
<text x="60" y="112" font-size="18" font-style="italic" fill="#76A9EE">A page that says what it is, to everything that reads it.</text>
<rect x="60" y="145" width="330" height="300" rx="10" fill="#25282C" stroke="#313438"/>
<text x="84" y="185" font-size="16" font-weight="700" fill="#B8BABD">Why It Exists</text>
<text x="84" y="218" font-size="17" font-weight="600" fill="#EFF1F4">Scrapers do not run JS.</text>
<text x="84" y="240" font-size="15" fill="#B8BABD">Social and AI crawlers fetch</text>
<text x="84" y="260" font-size="15" fill="#B8BABD">the raw HTML, not your app.</text>
<text x="84" y="296" font-size="17" font-weight="600" fill="#EFF1F4">Tags added later</text>
<text x="84" y="318" font-size="15" fill="#B8BABD">are tags they never see;</text>
<text x="84" y="338" font-size="15" fill="#B8BABD">the demo hides the gap.</text>
<text x="84" y="374" font-size="17" font-weight="600" fill="#EFF1F4">A shared link</text>
<text x="84" y="396" font-size="15" fill="#B8BABD">shows a bare URL: no title,</text>
<text x="84" y="416" font-size="15" fill="#B8BABD">no image, no description.</text>
<rect x="420" y="145" width="400" height="300" rx="10" fill="#25282C" stroke="#313438"/>
<text x="444" y="185" font-size="16" font-weight="700" fill="#B8BABD">What It Generates</text>
<text x="444" y="220" font-size="16" font-weight="600" fill="#EFF1F4">Head essentials</text>
<text x="444" y="240" font-size="15" fill="#B8BABD">title, description, canonical, robots</text>
<text x="444" y="272" font-size="16" font-weight="600" fill="#EFF1F4">Open Graph and Twitter cards</text>
<text x="444" y="292" font-size="15" fill="#B8BABD">a shared link previews correctly</text>
<text x="444" y="324" font-size="16" font-weight="600" fill="#EFF1F4">schema.org, sitemap, robots.txt</text>
<text x="444" y="344" font-size="15" fill="#B8BABD">structured data and the site files</text>
<text x="444" y="378" font-size="15" fill="#B8BABD">Emitted as a string in the server HTML,</text>
<text x="444" y="398" font-size="15" fill="#B8BABD">at build or render time, so every</text>
<text x="444" y="418" font-size="15" fill="#B8BABD">consumer reads it without running JS.</text>
<rect x="850" y="145" width="290" height="300" rx="10" fill="#25282C" stroke="#313438"/>
<text x="874" y="185" font-size="16" font-weight="700" fill="#B8BABD">Checked, Not Assumed</text>
<text x="874" y="236" font-size="40" font-weight="700" fill="#74AE80">Tiers 1&#8211;3</text>
<text x="874" y="264" font-size="15" fill="#B8BABD">head, cards, structured</text>
<text x="874" y="284" font-size="15" fill="#B8BABD">data, and the site files.</text>
<text x="874" y="324" font-size="16" font-weight="600" fill="#EFF1F4">A runnable audit</text>
<text x="874" y="344" font-size="15" fill="#B8BABD">checks a page against the</text>
<text x="874" y="364" font-size="15" fill="#B8BABD">standard, before it ships.</text>
<text x="874" y="400" font-size="16" font-weight="600" fill="#EFF1F4">Output is escaped,</text>
<text x="874" y="420" font-size="15" fill="#B8BABD">never an injection vector.</text>
<rect x="60" y="480" width="1080" height="110" rx="10" fill="#25282C" stroke="#313438"/>
<text x="84" y="516" font-size="16" font-weight="700" fill="#B8BABD">Against the Field</text>
<text x="84" y="544" font-size="16" font-weight="600" fill="#76A9EE">vs runtime injectors</text>
<text x="84" y="564" font-size="14" fill="#B8BABD">lands in the server HTML,</text>
<text x="84" y="581" font-size="14" fill="#B8BABD">not post-load tags</text>
<text x="349" y="544" font-size="16" font-weight="600" fill="#76A9EE">vs SEO plugins</text>
<text x="349" y="564" font-size="14" fill="#B8BABD">zero-dependency, themeable,</text>
<text x="349" y="581" font-size="14" fill="#B8BABD">nothing calls home</text>
<text x="614" y="544" font-size="16" font-weight="600" fill="#76A9EE">vs framework magic</text>
<text x="614" y="564" font-size="14" fill="#B8BABD">one portable string,</text>
<text x="614" y="581" font-size="14" fill="#B8BABD">any stack or none</text>
<text x="879" y="544" font-size="16" font-weight="600" fill="#76A9EE">vs no metadata</text>
<text x="879" y="564" font-size="14" fill="#B8BABD">the preview stops being</text>
<text x="879" y="581" font-size="14" fill="#B8BABD">a bare dead link</text>
<text x="1140" y="622" font-size="13" fill="#B8BABD" text-anchor="end">Apache-2.0 &#183; part of DS4AI, the Design Suite for AI</text>
</svg>
